version: '3.8'

services:
  # =========================================================================
  # 1. VAULT CONFIG MANAGER (GitHub Reposundan Otomatik Çeker & Derler)
  # =========================================================================
  # Docker Compose build context doğrudan GitHub reposu olarak ayarlanmıştır:
  # https://github.com/Eruaskina/VaultImporter.git
  # Docker, build sırasında repoyu otomatik klonlar ve Dockerfile'ı çalıştırır.
  vault-config-manager:
    build:
      context: https://github.com/Eruaskina/VaultImporter.git#main
      dockerfile: Dockerfile
    container_name: vault-config-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Şirket içi yerel IP'lere (10.240.x.x) veya host makinedeki Vault'a erişim (CORS / Network çözümü):
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vault-net

  # =========================================================================
  # 2. (OPSİYONEL) YEREL TEST İÇİN HASHICORP VAULT DEV SUNUCUSU
  # =========================================================================
  # Şirket içi sunucuya bağlı değilken yerel test yapmak için hazır Vault:
  vault-dev:
    image: hashicorp/vault:1.15
    container_name: vault-dev-server
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "s.demo-root-token-2026"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - vault-net

networks:
  vault-net:
    driver: bridge
