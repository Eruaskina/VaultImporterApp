services:
  # =========================================================================
  # 1. VAULT CONFIG MANAGER (Web Uygulaması & Backend Proxy)
  # =========================================================================
  vault-config-manager:
    build:
      context: https://github.com/Eruaskina/VaultImporterApp.git#main
      dockerfile: Dockerfile
    container_name: vault-config-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Host makinedeki veya şirket içi (10.240.x.x) Vault'a konteyner içinden erişim için:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vault-net

  # =========================================================================
  # 2. (OPSİYONEL) DOCKER İÇİNDE ÇALIŞAN HASHICORP VAULT DEV SUNUCUSU
  # =========================================================================
  vault-dev:
    image: hashicorp/vault:1.15
    container_name: vault-dev-server
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      # NOT: Vault Dev modunda token "s." ile başlayamaz (invalid request hatası verir).
      # Bu nedenle token "root" olarak ayarlanmıştır:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - vault-net

networks:
  vault-net:
    driver: bridge
